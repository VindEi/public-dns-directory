name: Test and Build Directory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0" # Once weekly on Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Schema and Resolver Tests
        run: npm test

      - name: Build index.json
        run: npm run build

      - name: Push index.json to data branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./dist
          keep_files: false
